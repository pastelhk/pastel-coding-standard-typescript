name: Code Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    name: Code Scan
    if: startsWith(github.repository, 'pastelhk/')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/npm-init
        with:
          restore-packages: false
          registry-url: ${{ vars.PRIVATE_NPM_REGISTRY_URL }}
          registry-username: ${{ vars.PRIVATE_NPM_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.PRIVATE_NPM_REGISTRY_PASSWORD }}

      # Intentionally use `npm install` instead of `npm ci` to detect updates to lock file
      - name: Install dependencies
        run: npm install

      - name: Check lock file clean
        id: check-lockfile
        run: git --no-pager diff --exit-code --numstat

      - name: Verify hoisting
        id: check-hoisting
        run: |
          echo "🔍 Scanning for any nested node_modules folders..."

          # Find nested node_modules, excluding root and its contents
          NESTED=$(find . -mindepth 2 -name node_modules -type d ! -path './node_modules/*' 2>/dev/null || true)

          if [ -n "$NESTED" ]; then
            echo "⚠️  Nested node_modules found:"
            echo "$NESTED"
            echo ""
            echo "Checking for real packages (looking for package.json files)..."

            # Look for package.json in nested node_modules (indicates real packages)
            REAL_PKGS=$(find . -path '*/node_modules/*/package.json' \
              ! -path './node_modules/*' \
              ! -path '*/node_modules/.*/*' \
              2>/dev/null || true)

            if [ -n "$REAL_PKGS" ]; then
              echo "❌ Found non-hoisted dependencies:"
              echo "$REAL_PKGS" | sed 's|/package.json||' | sort | uniq
              echo ""
              echo "💡 Fix: Ensure 'install-strategy=hoisted' in .npmrc and shared deps in root package.json"
              exit 1
            else
              echo "✅ Only build tool artifacts found (safe to ignore)"
            fi
          else
            echo "✅ Perfect hoisting — no nested node_modules anywhere!"
          fi
        continue-on-error: true

      - name: Cache ESLint caches
        uses: actions/cache@v4
        with:
          path: |
            **/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('**/package-lock.json', '**/eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Cache TS Build Info caches
        uses: actions/cache@v4
        with:
          path: |
            **/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('**/package-lock.json', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-

      - name: Check for vulnerabilities in dependencies
        if: ${{ github.actor != 'dependabot[bot]' }}
        id: check-audit
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Check package.json
        id: check-packages
        run: npm run check:packages
        continue-on-error: true

      - name: Check Format
        id: check-format
        run: npm run check:format
        continue-on-error: true

      - name: Check Type
        id: check-types
        run: npm run check:types
        continue-on-error: true

      - name: Check Lint
        id: check-lint
        run: npm run check:lint
        continue-on-error: true

      - name: Run Tests
        id: check-test
        run: npm run check:test
        continue-on-error: true

      - name: Test Report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests
          path: '**/__test-results__/**/*.xml'
          reporter: jest-junit
          fail-on-empty: false

      - name: SonarQube Scan
        id: check-sonarqube
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.projectVersion=${{ github.ref_name }}-${{ github.sha }}
        continue-on-error: true

      - name: Generate Results Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const checks = [
              { name: 'Lock file', outcome: '${{ steps.check-lockfile.outcome }}' },
              { name: 'Audit', outcome: '${{ steps.check-audit.outcome }}', isWarning: true },
              { name: 'Package.json', outcome: '${{ steps.check-packages.outcome }}' },
              { name: 'Hoisting', outcome: '${{ steps.check-hoisting.outcome }}' },
              { name: 'Format', outcome: '${{ steps.check-format.outcome }}' },
              { name: 'Types', outcome: '${{ steps.check-types.outcome }}' },
              { name: 'Lint', outcome: '${{ steps.check-lint.outcome }}' },
              { name: 'Tests', outcome: '${{ steps.check-test.outcome }}' },
              { name: 'SonarQube', outcome: '${{ steps.check-sonarqube.outcome }}', isWarning: true },
            ];

            const results = checks.map(c => ({
              name: c.name,
              status: c.isWarning && c.outcome === 'failure' ? '⚠️' : c.outcome === 'failure' ? '❌' : '✅',
              passed: c.isWarning ? true : c.outcome !== 'failure'
            }));

            // Console output
            console.log('\n📋 Code Scan Results\n');
            results.forEach(r => console.log(`${r.status} ${r.name}`));

            const allPassed = results.every(r => r.passed);
            if (allPassed) console.log('\n✅ All checks passed!');
            else console.log('\n⚠️  Some checks failed');

            // PR comment (if on pull request)
            if (context.eventName === 'pull_request') {
              const rows = results.map(r => `| ${r.name} | ${r.status} |`).join('\n');
              const summary = allPassed ? '✅ All checks passed!' : '⚠️ Some checks need attention';
              const body = `## 📋 Code Scan Results\n\n| Check | Status |\n|-------|--------|\n${rows}\n\n${summary}`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

            // Fail if any checks failed
            if (!allPassed) {
              core.setFailed('❌ Some checks failed. See results above.');
            }
